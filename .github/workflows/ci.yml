name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Supersede in-flight runs for the same branch or PR, so a rapid re-push does
  # not leave stale jobs consuming runners.
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest

    # Some behaviour cannot be proven in memory. Failed-login tracking relies on a
    # single atomic statement, and its concurrency guarantee is only meaningful
    # against a real server, so the suite gets one.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rbac_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Rbac-System.sln

      - name: Build
        run: dotnet build Rbac-System.sln --configuration Release --no-restore

      - name: Test
        env:
          # Database-backed tests skip themselves when this is absent, so CI is the
          # place that guarantees they actually run.
          ConnectionStrings__TestDatabase: >-
            Host=localhost;Port=5432;Database=rbac_test;Username=postgres;Password=postgres
        run: >-
          dotnet test Rbac-System.sln
          --configuration Release
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --logger "console;verbosity=normal"
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      - name: Upload test results
        # Results are most valuable precisely when the run failed.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./TestResults
          if-no-files-found: warn

  format:
    name: Format check
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify formatting
        # Mirrors the command documented in CONTRIBUTORS.md.
        run: dotnet format Rbac-System.sln --verify-no-changes

  vulnerable-packages:
    name: Vulnerability scan
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Rbac-System.sln

      - name: Fail on vulnerable packages
        # `dotnet list package --vulnerable` exits 0 even when it finds something,
        # so the output has to be inspected to turn a finding into a failed build.
        run: |
          dotnet list Rbac-System.sln package --vulnerable --include-transitive 2>&1 | tee vulnerable.log
          if grep -q "has the following vulnerable packages" vulnerable.log; then
            echo "::error::Vulnerable NuGet packages detected — see the log above."
            exit 1
          fi
          echo "No vulnerable packages found."
